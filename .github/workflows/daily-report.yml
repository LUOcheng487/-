name: 禁售日报推送

on:
  schedule:
    # GitHub cron 用UTC：1:00 UTC = 北京时间 09:00
    # 发送规则：只要仓库 data/ 里有"报告日期(昨天)"的禁售记录就发；没有则当天不发。
    # 注意：GitHub 定时任务可能有几分钟到数小时的延迟，属平台排队，非脚本问题
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '报告日期 YYYY-MM-DD（留空=北京时间昨天）'
        required: false
        default: ''
      force:
        description: '报告日无数据也强制发送（填 1 生效）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: report/requirements.txt

      - run: pip install -r report/requirements.txt

      - name: 生成并发送日报
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
          DING_SECRET: ${{ secrets.DING_SECRET }}
          REPORT_DATE: ${{ github.event.inputs.date }}
          FORCE: ${{ github.event.inputs.force }}
        run: python report/daily_report.py --data-dir data
