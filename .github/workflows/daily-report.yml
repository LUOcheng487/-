name: 禁售日报推送

on:
  # 只有手动/外部触发，不再用 GitHub 自带 schedule。
  # 原因：GitHub 免费额度的定时排队延迟可达数小时（实测被推后到晚上 19:2x），
  # 且与本机 8:58 的主动触发叠加会造成同一天发两条。
  # 每天 09:00 由本机计划任务「禁售日报云端触发」(08:58) 调 workflow_dispatch 触发。
  # 发送规则：仓库 data/ 里有"报告日期(昨天)"的禁售记录就发；没有则当天不发。
  workflow_dispatch:
    inputs:
      date:
        description: '报告日期 YYYY-MM-DD（留空=北京时间昨天）'
        required: false
        default: ''
      force:
        description: '报告日无数据也强制发送（填 1 生效）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: report/requirements.txt

      - run: pip install -r report/requirements.txt

      - name: 生成并发送日报
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
          DING_SECRET: ${{ secrets.DING_SECRET }}
          REPORT_DATE: ${{ github.event.inputs.date }}
          FORCE: ${{ github.event.inputs.force }}
        run: python report/daily_report.py --data-dir data
