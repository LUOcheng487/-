name: 禁售日报推送

on:
  schedule:
    # GitHub cron 用UTC：3:05 UTC = 北京时间 11:05
    # 之所以放在11点后：脚本会检查"今天11:00前是否已推送过禁售数据"，
    # 没有推送则当天不发钉钉，避免发空报表/旧数据。
    # 注意：GitHub 定时任务可能有几分钟延迟，属正常现象
    - cron: '5 3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '报告日期 YYYY-MM-DD（留空=北京时间昨天）'
        required: false
        default: ''
      force:
        description: '忽略闸门强制发送（填 1：即使今天11点前没同步也发）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: report/requirements.txt

      - run: pip install -r report/requirements.txt

      - name: 生成并发送日报
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
          DING_SECRET: ${{ secrets.DING_SECRET }}
          REPORT_DATE: ${{ github.event.inputs.date }}
          FORCE: ${{ github.event.inputs.force }}
          GATE_TIME: '11:00'
        run: python report/daily_report.py --data-dir data
